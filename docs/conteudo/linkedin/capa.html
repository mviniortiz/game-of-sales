<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Capa da Company Page do LinkedIn (1128x191, renderizada em 2x). Design system
     Vyzon Solar: papel frio, Archivo, marca-texto só atrás de tinta, a conversa de
     WhatsApp como objeto. Os primeiros 300 px à esquerda (abaixo de y 70) ficam livres: o quadro do logo
     cobre essa área no desktop; no celular o LinkedIn corta as laterais. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Barlow+Condensed:wght@700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f7f9;--ink:#0d1421;--muted:#4a5363;--subtle:#5f6776;--line:#d9dde4;--blue:#1556c0;--marker:#ffd84a;--chat:#efeae2;--out:#d9fdd3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1128px;height:191px;overflow:hidden;background:var(--paper);font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.c{position:relative;width:1128px;height:191px}
.txt{position:absolute;left:300px;top:30px;width:455px}
.k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--subtle);margin-bottom:9px}
h1{font:800 26px/1.12 Archivo,sans-serif;letter-spacing:-.03em}
.m{background:linear-gradient(transparent 0 56%,var(--marker) 56% 92%,transparent 92%);padding:0 .05em}
.chat{position:absolute;right:56px;top:24px;width:292px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(13,20,33,.06),0 14px 28px -16px rgba(13,20,33,.35)}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.av{width:20px;height:20px;border-radius:99px;background:radial-gradient(circle at 38% 30%,#34508a 0%,#1b2b4e 48%,#0b1220 100%);position:relative}
.av i{position:absolute;top:7px;width:3px;height:5px;border-radius:2px;background:#fff}.av i:first-child{left:6px}.av i:last-child{left:11px}
.nm{font-size:10.5px;font-weight:600}.st{font-size:8.5px;color:var(--subtle)}
.body{background:var(--chat);padding:7px 8px 8px;display:flex;flex-direction:column;gap:5px}
.b{max-width:92%;align-self:flex-start;background:#fff;border-radius:7px;padding:5px 7px 3px;font-size:9.5px;line-height:1.35;box-shadow:0 1px .5px rgba(13,20,33,.12)}
.b.o{align-self:flex-end;background:var(--out);font-weight:600;font-size:11px}
.r{border-left:2.5px solid var(--blue);padding-left:5px;margin:2px 0}
.h{display:block;text-align:right;font-size:7.5px;color:var(--subtle);font-weight:400}
.n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px}
</style></head><body><div class="c">
<div class="txt">
  <p class="k">Para integrador de energia solar que vende pelo WhatsApp</p>
  <h1>No 2º dia sem resposta, a mensagem pra chamar de volta <span class="m">chega pronta no seu WhatsApp.</span></h1>
</div>
<div class="chat">
  <div class="top"><div class="av"><i></i><i></i></div><div><p class="nm">Aviso do Vyzon</p><p class="st">no seu WhatsApp</p></div></div>
  <div class="body">
    <div class="b"><strong>EVA [A2] rascunho pronto</strong> · Carlos, <span class="n">R$ 24.900</span>, 2 dias
      <p class="r">Oi, Carlos, conseguiu olhar a proposta?</p><span class="h">09:02</span></div>
    <div class="b o">1<span class="h">09:03</span></div>
  </div>
</div>
</div></body></html>
