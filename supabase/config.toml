[auth]
site_url = "https://vyzon.com.br"
additional_redirect_urls = [
  "https://vyzon.com.br/**",
  "https://www.vyzon.com.br/**",
  "http://localhost:5173/**",
  "http://localhost:8080/**"
]

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Vyzon"
content_path = "./supabase/email-templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Redefinir sua senha do Vyzon"
content_path = "./supabase/email-templates/reset-password.html"

[auth.email.template.email_change]
subject = "Confirme seu e-mail novo no Vyzon"
content_path = "./supabase/email-templates/change-email.html"

[auth.email.template.invite]
subject = "Seu acesso ao Vyzon"
content_path = "./supabase/email-templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no Vyzon"
content_path = "./supabase/email-templates/magic-link.html"

[auth.email.template.reauthentication]
subject = "Seu código do Vyzon"
content_path = "./supabase/email-templates/reauthentication.html"

[functions.google-oauth-callback]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

[functions.evolution-message-webhook]
verify_jwt = false

# Kapso assina com HMAC (X-Webhook-Signature); não manda JWT do Supabase.
[functions.kapso-webhook]
verify_jwt = false

# Só aceita Bearer igual à service_role, conferido dentro da função.
[functions.quote-pdf-amount]
verify_jwt = false

# CONTA.1: chamada pelo webhook com Bearer service_role, conferido no código.
